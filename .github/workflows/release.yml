# Build and Release

on:
  push:
    branches:
      - 'unstable'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache-dependency-path: "**/*.sum"
          # A tag run can't restore unstable's cache (only its own ref and the default branch),
          # and saving a fresh ~2 GB one for a tag that never builds again only slows the release
          # down and eats the repo's cache quota.
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Set up Rust
        env:
          CARGO_NDK_VERSION: v4.1.2
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          # The prebuilt release binaries instead of `cargo install` (a 1-2 min compile every run).
          curl -sSfL "https://github.com/bbqsrc/cargo-ndk/releases/download/${CARGO_NDK_VERSION}/cargo-ndk-x86_64-unknown-linux-gnu-${CARGO_NDK_VERSION}.tgz" \
            | tar -xz --strip-components=1 -C "$HOME/.cargo/bin"
          cargo ndk --version

      - name: Cache Rust build
        # Same reasoning as setup-go's cache above for tags.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            build/rust-target
          key: ${{ runner.os }}-rust-${{ hashFiles('external/csqtt/rust-client/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Resolve NDK and Build Tools versions
        id: vars
        run: |
          # Read NDK version from build.gradle.kts or use a fallback
          NDK_VERSION=$(grep "ndkVersion =" app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' || echo "29.0.14206865")
          # Read Compile SDK (matches build tools) from gradle.properties
          BUILD_TOOLS=$(grep "project.compileSdk=" gradle.properties | cut -d'=' -f2 || echo "36")
          # Read Version Name from gradle.properties
          VERSION_NAME=$(grep "project.versionName=" gradle.properties | cut -d'=' -f2)
          # Get short git hash
          SHA_SHORT=$(git rev-parse --short HEAD)
          
          echo "ndk_version=$NDK_VERSION" >> $GITHUB_OUTPUT
          echo "build_tools=$BUILD_TOOLS.0.0" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "sha_short=$SHA_SHORT" >> $GITHUB_OUTPUT
          # ANDROID_HOME comes from the runner image, which the "env" expression context doesn't
          # see (it only holds variables the workflow itself sets) - hand it on as an output.
          echo "android_home=$ANDROID_HOME" >> $GITHUB_OUTPUT

          # Add sdkmanager to PATH
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/tools/bin" >> $GITHUB_PATH

      - name: Check preinstalled NDK
        id: ndk_preinstalled
        run: |
          if [ -d "${{ steps.vars.outputs.android_home }}/ndk/${{ steps.vars.outputs.ndk_version }}" ]; then
            echo "present=true" >> $GITHUB_OUTPUT
          else
            echo "present=false" >> $GITHUB_OUTPUT
          fi

      - name: Cache NDK
        # Only when the runner image lacks this NDK: restoring over the image's own (root-owned)
        # copy fails on every file and counts as a miss, after downloading ~700 MB for nothing.
        # Like setup-go's cache below: a tag can't restore unstable's, and saving its own for a
        # tag that never builds again only eats the repo's cache quota.
        if: ${{ steps.ndk_preinstalled.outputs.present != 'true' && !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@v5
        id: ndk_cache
        with:
          path: ${{ steps.vars.outputs.android_home }}/ndk/${{ steps.vars.outputs.ndk_version }}
          key: ndk-${{ steps.vars.outputs.ndk_version }}

      - name: Install NDK and Build Tools
        run: |
          yes | sdkmanager "ndk;${{ steps.vars.outputs.ndk_version }}" "build-tools;${{ steps.vars.outputs.build_tools }}"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 pkg-config

      - name: Cache Native Binaries (Go/C)
        uses: actions/cache@v5
        id: native_cache
        with:
          path: |
            app/src/main/jniLibs/*/libolcrtc.so
            app/src/main/jniLibs/*/libxray.so
            app/src/main/jniLibs/*/libturnable.so
            app/src/main/jniLibs/*/libhevsocks5.so
            app/src/main/jniLibs/*/libwebdav.so
            app/src/main/jniLibs/*/libsocks2tun.so
            app/src/main/jniLibs/*/libcsqtt.so
            app/src/main/jniLibs/*/libfreeturn.so
            app/src/main/jniLibs/*/libqwdtt.so
            app/src/main/jniLibs/*/libopenflux.so
            app/src/main/jniLibs/*/libbyedpi.so
            external/*/.git_hash_*
            external/csqtt/rust-client/.git_hash_*
            external/proxy-turn-vk-android/go_client/.git_hash_*
            external/hev-socks5-tunnel/.git_hash
          key: ${{ runner.os }}-native-${{ steps.vars.outputs.ndk_version }}-${{ hashFiles('build.sh', 'external/olcrtc/**', 'external/vless-client/**', 'external/turnable/**', 'external/hev-socks5-tunnel/**', 'external/webdav-tunnel/**', 'external/socks2tun/**', 'external/csqtt/rust-client/**', 'external/free-turn-proxy/**', 'external/proxy-turn-vk-android/go_client/**', 'external/openflux/**', 'external/byedpi/**') }}
          restore-keys: |
            ${{ runner.os }}-native-${{ steps.vars.outputs.ndk_version }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleRelease -Pandroid.ndkVersion=${{ steps.vars.outputs.ndk_version }}

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ steps.vars.outputs.build_tools }}

      - name: Clean up and Rename APKs
        run: |
          mkdir -p final_apks
          
          find app/build/outputs/apk/release -name "*-signed.apk" | while read -r file; do
            if [ -f "$file" ]; then
              filename=$(basename "$file" | sed 's/-signed//')
              cp "$file" "final_apks/$filename"
              echo "Prepared signed file: $filename"
            fi
          done
          
          if [ -z "$(ls -A final_apks)" ]; then
            echo "ERROR: No signed APKs were found!"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: wireturn-release-apk
          path: final_apks/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: final_apks/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup Unstable Release on Stable Tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME="${{ github.ref_name }}-unstable"
          gh release delete "$TAG_NAME" --yes --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete Old Unstable Release
        if: github.ref == 'refs/heads/unstable'
        run: |
          gh release delete unstable-latest --yes --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Unstable Release
        uses: softprops/action-gh-release@v3
        if: github.ref == 'refs/heads/unstable'
        with:
          tag_name: unstable-latest
          name: "Unstable Build v${{ steps.vars.outputs.version_name }}-${{ steps.vars.outputs.sha_short }}"
          generate_release_notes: true
          files: final_apks/*.apk
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
